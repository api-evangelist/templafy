openapi: 3.2.0
info:
  contact:
    url: https://support.templafy.com/hc/en-us/requests/new
    name: Submit support ticket
  description: Please refer to our documentation for guidelines and examples.
  title: Templafy Public Folders API
  version: v4
  termsOfService: https://www.templafy.com/templafy-saas-agreement/
servers:
- variables:
    tenantId:
      default: ''
      description: Your Templafy subdomain, i.e., https://{TenantId}.api.templafy.com
  url: https://{tenantId}.api.templafy.com/v4
tags:
- name: Folders
paths:
  /libraries/{spaceId}/{libraryType}/folders/{folderId}:
    get:
      tags:
      - Folders
      summary: Returns the folder by the identifier
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the folder to retrieve
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
      security:
      - bearerAuth:
        - library.read
        - library.readwrite
      operationId: getLibrariesBySpaceIdByLibraryTypeFoldersByFolderId
      x-operation-id-source: derived
    patch:
      tags:
      - Folders
      summary: Updates the folder
      description: The root folder can not be updated.
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the folder to be updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateFolderRequest'
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
        '409':
          description: The operation cannot be completed due to a conflict with the current state of the folder. This may occur if a folder with the provided name already exists, or if the destination folder is in the process of being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
      security:
      - bearerAuth:
        - library.readwrite
      operationId: patchLibrariesBySpaceIdByLibraryTypeFoldersByFolderId
      x-operation-id-source: derived
    delete:
      tags:
      - Folders
      summary: Deletes the folder by the identifier
      description: The root folder of the library can not be deleted.
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the folder to delete
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
        '409':
          description: The root folder can not be deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
      security:
      - bearerAuth:
        - library.readwrite
      operationId: deleteLibrariesBySpaceIdByLibraryTypeFoldersByFolderId
      x-operation-id-source: derived
  /libraries/{spaceId}/{libraryType}/folders/{folderId}/folders:
    get:
      tags:
      - Folders
      summary: Lists all direct folders in the folder. The result does not include subfolders
      description: The folders from the library can be retrieved by using the root folder identifier.
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the folder which children should be retrieved
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Folder'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
      security:
      - bearerAuth:
        - library.read
        - library.readwrite
      operationId: getLibrariesBySpaceIdByLibraryTypeFoldersByFolderIdFolders
      x-operation-id-source: derived
    post:
      tags:
      - Folders
      summary: Creates a folder inside the specified folder
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the parent folder in which a new folder is created
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CreateFolderRequest'
      responses:
        '201':
          description: The identifier of the created folder
          content:
            application/json:
              schema:
                type: integer
                format: int64
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
        '409':
          description: The operation cannot be completed due to a conflict with the current state of the folder. This may occur if a folder with the provided name already exists, or if the parent folder is in the process of being deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
      security:
      - bearerAuth:
        - library.readwrite
      operationId: postLibrariesBySpaceIdByLibraryTypeFoldersByFolderIdFolders
      x-operation-id-source: derived
  /libraries/{spaceId}/{libraryType}/folders/{folderId}/security:
    get:
      tags:
      - Folders
      summary: Returns the list of users and user groups that has access to the folder
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the folder to retrieve
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderSecurityResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
      security:
      - bearerAuth:
        - library.read
        - library.readwrite
      operationId: getLibrariesBySpaceIdByLibraryTypeFoldersByFolderIdSecurity
      x-operation-id-source: derived
    put:
      tags:
      - Folders
      summary: Updates the list of users and user groups that has access to folder.
      parameters:
      - name: spaceId
        in: path
        description: The identifier of the space
        required: true
        schema:
          type: integer
          format: int64
      - name: libraryType
        in: path
        description: The type of the library you work with
        required: true
        schema:
          $ref: '#/components/schemas/LibraryType'
      - name: folderId
        in: path
        description: The identifier of the folder to be updated
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateFolderSecurityRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderSecurityRequest'
          text/json:
            schema:
              $ref: '#/components/schemas/UpdateFolderSecurityRequest'
          application/*+json:
            schema:
              $ref: '#/components/schemas/UpdateFolderSecurityRequest'
      responses:
        '200':
          description: The folder security has been updated
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundProblemDetails'
        '409':
          description: The operation cannot be completed due to a conflict with the current state of the folder.This may occur if the security is set on a parent folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictProblemDetails'
      security:
      - bearerAuth:
        - library.readwrite
      operationId: putLibrariesBySpaceIdByLibraryTypeFoldersByFolderIdSecurity
      x-operation-id-source: derived
components:
  schemas:
    FolderState:
      enum:
      - ready
      - deleting
      type: string
      description: The current state of the folder
    FolderSecurityResponse:
      required:
      - accessStatus
      type: object
      properties:
        accessStatus:
          $ref: '#/components/schemas/ResponseFolderAccessStatus'
        userIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of users who has access to the folder
        userGroupIds:
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of user groups which has access to the folder
      additionalProperties: false
    NotFoundProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
      additionalProperties: false
      example:
        title: NotFound
        detail: The server can not find the requested resource.
        status: 404
        traceId: d61f7ce-cccb-4e5b-8727-3b68a61a0559
    UpdateFolderSecurityRequest:
      type: object
      properties:
        accessStatus:
          $ref: '#/components/schemas/RequestFolderAccessStatus'
        userIds:
          maxItems: 150
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of users who has access to the folder
        userGroupIds:
          maxItems: 50
          type:
          - array
          - 'null'
          items:
            type: string
          description: List of user groups which has access to the folder
      additionalProperties: false
      description: The request model to update security of a folder
    CreateFolderRequest:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: Display name
      additionalProperties: false
      description: The request model to create a folder
    Folder:
      required:
      - id
      - libraryId
      - modifiedAt
      - name
      - navigationPath
      - state
      type: object
      properties:
        id:
          type: integer
          description: Unique folder identifier
          format: int64
        libraryId:
          type: integer
          description: Unique library identifier
          format: int64
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: Display name
        parentId:
          type:
          - integer
          - 'null'
          description: Unique identifier for the parent folder. The root folder does not have a parent folder identifier
          format: int64
        navigationPath:
          maxLength: 700
          minLength: 1
          type: string
          description: Hierarchical path in lowercase based on the location of a folder. E.g. "folder-a/folder-b" when the location is "Folder A > Folder B"
        modifiedAt:
          minLength: 1
          type: string
          description: Date and time in ISO 8601 format of when the folder was last modified
        state:
          $ref: '#/components/schemas/FolderState'
      additionalProperties: false
    ResponseFolderAccessStatus:
      enum:
      - inheritedLocked
      - restricted
      - everyoneInTheSpace
      type: string
      description: The status of the folder access. It is either available to everyone in the space, restricted directly to a list of users and user groups or via a parent folder.
    UpdateFolderRequest:
      type: object
      properties:
        name:
          maxLength: 100
          type:
          - string
          - 'null'
          description: Display name
        parentFolderId:
          type:
          - integer
          - 'null'
          description: The identifier of a folder that current folder should be moved to
          format: int64
      additionalProperties: false
      description: The request model to update the folder
    ConflictProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
      additionalProperties: false
      example:
        title: Conflict
        detail: The request could not be completed due to a conflict with the current state of the resource.
        status: 409
        traceId: d61f7ce-cccb-4e5b-8727-3b68a61a0559
    RequestFolderAccessStatus:
      enum:
      - restricted
      - everyoneInTheSpace
      type: string
      description: The status of the folder access. It is either available to everyone in the space or restricted to a limited list of users and user groups.
    LibraryType:
      enum:
      - documents
      - presentations
      - spreadsheets
      - slides
      - slide-elements
      - text-elements
      - images
      - pdfs
      - links
      - email-elements
      type: string
      description: Type of the assets that can be stored in the library
    ValidationProblemDetails:
      type: object
      properties:
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
      additionalProperties: false
      example:
        errors:
        - name: The name field is required
        - data: The input was invalid
        title: One or more validation errors occurred.
        status: 400
        traceId: d61f7ce-cccb-4e5b-8727-3b68a61a0559
    FolderDetails:
      required:
      - id
      - libraryId
      - modifiedAt
      - name
      - navigationPath
      - state
      type: object
      properties:
        id:
          type: integer
          description: Unique folder identifier
          format: int64
        libraryId:
          type: integer
          description: Unique library identifier
          format: int64
        name:
          maxLength: 100
          minLength: 1
          type: string
          description: Display name
        parentId:
          type:
          - integer
          - 'null'
          description: Unique identifier for the parent folder. The root folder does not have a parent folder identifier
          format: int64
        navigationPath:
          maxLength: 700
          minLength: 1
          type: string
          description: Hierarchical path in lowercase based on the location of a folder. E.g. "folder-a/folder-b" when the location is "Folder A > Folder B"
        modifiedAt:
          minLength: 1
          type: string
          description: Date and time in ISO 8601 format of when the folder was last modified
        state:
          $ref: '#/components/schemas/FolderState'
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
