openapi: 3.2.0
info:
  contact:
    url: https://support.templafy.com/hc/en-us/requests/new
    name: Submit support ticket
  description: Please refer to our documentation for guidelines and examples.
  title: Templafy Public Spaces API
  version: v4
  termsOfService: https://www.templafy.com/templafy-saas-agreement/
servers:
- variables:
    tenantId:
      default: ''
      description: Your Templafy subdomain, i.e., https://{TenantId}.api.templafy.com
  url: https://{tenantId}.api.templafy.com/v4
tags:
- name: Spaces
paths:
  /spaces:
    get:
      tags:
      - Spaces
      summary: Lists all existing active spaces
      description: Returns a list of all active spaces.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Space'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
      security:
      - bearerAuth:
        - spaces.read
      operationId: getSpaces
      x-operation-id-source: derived
components:
  schemas:
    Space:
      required:
      - id
      - name
      type: object
      properties:
        id:
          type: integer
          description: Unique Space identifier
          format: int64
        name:
          maxLength: 50
          minLength: 1
          type: string
          description: Space name
      additionalProperties: false
      example:
        id: 541244332157142140
        name: Global Brand
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
