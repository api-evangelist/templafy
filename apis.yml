aid: templafy
name: Templafy
description: >-
  Templafy is an enterprise document-generation and content-enablement platform that helps large
  organizations keep every document, presentation, email, and spreadsheet on-brand and compliant.
  Its REST Public API automates template and digital-asset management across spaces, libraries, and
  folders, maintains structured data sources, and generates documents, presentations, spreadsheets,
  and text elements from templates. Authentication uses a scoped API key sent as an HTTP bearer
  token created in the Templafy Admin Center; the API is versioned in the URI path (v1-v4 plus an
  unstable channel) with per-version stability levels, returns RFC 7807/9457 Problem Details errors,
  and paginates lists with pageNumber/pageSize.
